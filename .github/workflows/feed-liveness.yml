name: Feed liveness

on:
  schedule:
    - cron: "45 6 * * 1" # Mondays 06:45 UTC (staggered off the link check at 07:30)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liveness:
    name: check keyless feeds are alive
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # to open the failing-feed issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # Build so the scripts' @openconditions/* package imports resolve at runtime.
      - run: pnpm build
      - name: Check keyless feeds
        id: liveness
        # Keyless feeds only — forks/CI hold no feed secrets. The script never
        # fails the job; it writes ./liveness/out.md and sets found=true when a
        # feed is down, and we report via an issue below (non-gating).
        run: node scripts/check-feed-liveness.ts
      - name: Find existing failing-feed issue
        id: find-issue
        if: steps.liveness.outputs.found == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const title = 'Keyless feed liveness check found failing feeds';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existingIssue = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );

            if (existingIssue) {
              core.setOutput('issue-number', String(existingIssue.number));
            }
      - name: Open an issue for failing feeds
        if: steps.liveness.outputs.found == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: Keyless feed liveness check found failing feeds
          content-filepath: ./liveness/out.md
          issue-number: ${{ steps.find-issue.outputs.issue-number }}
          labels: feed-issue
