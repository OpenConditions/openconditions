name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

# No source checkout or candidate execution in this privileged event.
permissions: {}

jobs:
  validate:
    name: Validate conventional commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The pinned action reads the title and, with wip:true, writes the existing
      # action-semantic-pull-request commit status. It does not modify the PR.
      pull-requests: read
      statuses: write
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            build
            perf
            style
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
            Example: `fix: keep last-good rows on fetch failure` (not `Fix: ...`).
          wip: true
