name: Issue triage drift

on:
  schedule:
    - cron: "23 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: issue-triage-drift
  cancel-in-progress: false

jobs:
  report:
    if: github.repository == 'OpenConditions/openconditions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Observe current issue drift without repair
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/issue-triage.mjs drift
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue-triage-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: issue-triage-drift.json
          if-no-files-found: error
          retention-days: 3
