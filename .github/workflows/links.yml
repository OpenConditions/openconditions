name: Link check

on:
  schedule:
    - cron: "30 7 * * 1" # Mondays 07:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-report
  cancel-in-progress: false

jobs:
  lychee:
    name: check links in docs
    runs-on: ubuntu-latest
    # Keep the existing 360-minute runner bound; no measured short-timeout claim.
    permissions:
      contents: read
      issues: write # supplied only to the reporting parent below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: setup
        with:
          node-version-file: .nvmrc
      - name: Prepare execution evidence
        id: prepare
        run: node scripts/run-link-check.mjs prepare
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Same Markdown scope, Git ignore behavior, URL exclusions and cache.
          args: >-
            --no-progress --cache --max-cache-age 1d
            './**/*.md'
          lycheeVersion: v0.24.2
          format: json
          output: lychee/out.json
          checkbox: false
          jobSummary: false
          token: "" # no reporting token reaches lychee or its child tools
          fail: false # the finalizer distinguishes broken links from execution failure
      - name: Record installed checker version
        id: version
        if: steps.lychee.outcome == 'success' && (steps.lychee.outputs.exit_code == '0' || steps.lychee.outputs.exit_code == '2')
        run: lychee --version > lychee/version.txt
      - name: Check npm registry metadata
        id: registry
        if: steps.lychee.outcome == 'success' && (steps.lychee.outputs.exit_code == '0' || steps.lychee.outputs.exit_code == '2')
        run: node scripts/run-link-check.mjs registry
      - name: Validate completion and report
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          LYCHEE_OUTCOME: ${{ steps.lychee.outcome }}
          LYCHEE_EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          REGISTRY_OUTCOME: ${{ steps.registry.outcome }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/run-link-check.mjs finish
      - name: Retain completion evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: link-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: lychee/
          retention-days: 3
          if-no-files-found: warn
