name: Link check

on:
  schedule:
    - cron: "30 7 * * 1" # Mondays 07:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: check links in docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # to open/update the broken-links issue
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Markdown across the repo; node_modules and other gitignored paths are
          # skipped automatically. Tune ignored URLs in .lycheeignore.
          args: >-
            --no-progress --cache --max-cache-age 1d
            './**/*.md'
          fail: false # don't fail the run; we report via an issue instead
      - name: Check npm registry metadata
        id: npm-registry
        shell: bash
        env:
          NPM_REGISTRY_URLS: |
            https://registry.npmjs.org/hyparquet-writer
            https://registry.npmjs.org/@divviup%2Fprio3
            https://registry.npmjs.org/@divviup%2Fvdaf
        run: |
          set -euo pipefail
          failed=0
          report=./lychee/npm-out.md
          {
            printf '# npm registry metadata check\n\n'
            printf 'Registry endpoints are checked directly so package JSON is not recursively parsed as a document.\n\n'
            printf '## Errors per input\n\n'
            while IFS= read -r url; do
              if [[ -z "$url" ]]; then
                continue
              fi
              if http_code="$(curl --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$url")"; then
                if [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
                  printf '* [%s] <%s>\n' "$http_code" "$url"
                else
                  failed=1
                  printf '* [%s] <%s> | Rejected status code\n' "$http_code" "$url"
                fi
              else
                failed=1
                printf '* [000] <%s> | Request failed\n' "$url"
              fi
            done <<< "$NPM_REGISTRY_URLS"
          } > "$report"
          printf 'exit_code=%s\n' "$failed" >> "$GITHUB_OUTPUT"
      - name: Combine link-check reports
        if: steps.lychee.outputs.exit_code != 0 || steps.npm-registry.outputs.exit_code != 0
        shell: bash
        env:
          LYCHEE_EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
          NPM_REGISTRY_EXIT_CODE: ${{ steps.npm-registry.outputs.exit_code }}
        run: |
          set -euo pipefail
          {
            if [[ "$LYCHEE_EXIT_CODE" != "0" ]]; then
              cat ./lychee/out.md
            fi
            if [[ "$NPM_REGISTRY_EXIT_CODE" != "0" ]]; then
              if [[ "$LYCHEE_EXIT_CODE" != "0" ]]; then
                printf '\n\n'
              fi
              cat ./lychee/npm-out.md
            fi
          } > ./lychee/combined-out.md
      - name: Find existing broken-links issue
        id: find-issue
        if: steps.lychee.outputs.exit_code != 0 || steps.npm-registry.outputs.exit_code != 0
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const title = 'Broken links found by lychee';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existingIssue = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );

            if (existingIssue) {
              core.setOutput('issue-number', String(existingIssue.number));
            }
      - name: Open an issue on broken links
        if: steps.lychee.outputs.exit_code != 0 || steps.npm-registry.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: Broken links found by lychee
          content-filepath: ./lychee/combined-out.md
          issue-number: ${{ steps.find-issue.outputs.issue-number }}
          labels: documentation, broken-link
