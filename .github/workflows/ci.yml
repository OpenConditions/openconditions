name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Reconciliation only: independently read main SHA (leave empty for manual CI)"
        type: string
        required: false
        default: ""

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_main_sha != '' && format('Main validation recovery {0}', inputs.expected_main_sha) || format('{0} {1}', github.event_name, github.ref_name) }}

env:
  EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha || '' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source:
    name: validate CI source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Reject stale main recovery before dependency execution
        run: node scripts/check-ci-results.ts source

  ci:
    needs: source
    if: github.event_name != 'schedule'
    name: typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Version is read from package.json "packageManager" (single source of
      # truth). Passing `version:` here too errors: "Multiple versions of pnpm".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The OpenLR encoder's output is cross-checked against the Python
      # openlr library (packages/openlr/src/__tests__/python-openlr.test.ts).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: packages/openlr/python/requirements.txt

      - name: Install the OpenLR cross-check library
        run: pip install --require-hashes -r packages/openlr/python/requirements.txt

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Feeds lint
        run: pnpm feeds:lint

      - name: Feed schemas up to date
        run: pnpm check:feed-schemas

      - name: Credential guide up to date
        run: pnpm check-credentials

      - name: Model artifacts up to date
        run: pnpm check:model

      - name: Test
        run: pnpm test
        env:
          OPENLR_CROSSCHECK: required

  python-ci:
    needs: source
    if: github.event_name != 'schedule'
    name: python lint / test (openlr-resolver)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/openlr-resolver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            services/openlr-resolver/requirements.txt
            services/openlr-resolver/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest
        env:
          OPENLR_POSTGIS_TESTS: required

  interop:
    needs: source
    if: github.event_name != 'schedule'
    # Independent implementations read what OpenConditions writes: the pinned
    # libtraff reader (Java), and python-tuf both ways against the registry's
    # TUF repository tool and client. Both are hash-pinned and disposable.
    name: interop (libtraff, python-tuf)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/tuf-interop/requirements.txt

      - run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-interop-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-interop-${{ runner.os }}-
            turbo-${{ runner.os }}-

      - name: Build emitters and federation
        run: >-
          pnpm turbo run build --output-logs=errors-only
          --filter=@openconditions/publishers...
          --filter=@openconditions/model-registry...
          --filter=@openconditions/federation...

      - name: TraFF feeds through libtraff
        run: bash scripts/traff-interop/check.sh

      - name: Registry TUF repositories through python-tuf
        run: bash scripts/tuf-interop/check.sh

  production-audit:
    needs: source
    name: production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/openlr-resolver/requirements-dev.txt

      - run: pnpm install --frozen-lockfile

      - name: Install Python audit tool
        working-directory: services/openlr-resolver
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Require clean production dependency audits
        run: pnpm audit:production

  required-ci:
    name: required CI
    if: always()
    needs: [source, ci, python-ci, interop, production-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Require all applicable CI outcomes
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/check-ci-results.ts results

  full-main-qualification:
    name: full main qualification
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [source, ci, python-ci, interop, production-audit, required-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Record only complete executed main coverage
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/check-ci-results.ts full-main
