name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Reconciliation only: independently read main SHA (leave empty for manual CI)"
        type: string
        required: false
        default: ""

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_main_sha != '' && format('Main validation recovery {0}', inputs.expected_main_sha) || format('{0} {1}', github.event_name, github.ref_name) }}

env:
  EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha || '' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source:
    name: validate CI source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Reject stale main recovery before dependency execution
        run: node scripts/check-ci-results.ts source

  ci:
    needs: source
    if: github.event_name != 'schedule'
    name: typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Version is read from package.json "packageManager" (single source of
      # truth). Passing `version:` here too errors: "Multiple versions of pnpm".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The OpenLR encoder's output is cross-checked against the Python
      # openlr library (packages/openlr/src/__tests__/python-openlr.test.ts).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: packages/openlr/python/requirements.txt

      - name: Install the OpenLR cross-check library
        run: pip install --require-hashes -r packages/openlr/python/requirements.txt

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Feeds lint
        run: pnpm feeds:lint

      - name: Feed schemas up to date
        run: pnpm check:feed-schemas

      - name: Credential guide up to date
        run: pnpm check-credentials

      - name: Model artifacts up to date
        run: pnpm check:model

      - name: Test
        run: pnpm test
        env:
          OPENLR_CROSSCHECK: required

  python-ci:
    needs: source
    if: github.event_name != 'schedule'
    name: python lint / test (openlr-resolver)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/openlr-resolver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            services/openlr-resolver/requirements.txt
            services/openlr-resolver/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: >-
          ruff check . ../../scripts/qualify-container-images.py
          ../../scripts/trusted-main-image-evidence.py
          ../../scripts/__tests__/test_trusted_main_images.py

      - name: Test
        run: python -m pytest

  interop:
    needs: source
    if: github.event_name != 'schedule'
    # Independent implementations read what OpenConditions writes: the pinned
    # libtraff reader (Java), and python-tuf both ways against the registry's
    # TUF repository tool and client. Both are hash-pinned and disposable.
    name: interop (libtraff, python-tuf)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/tuf-interop/requirements.txt

      - run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-interop-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-interop-${{ runner.os }}-
            turbo-${{ runner.os }}-

      - name: Build emitters and federation
        run: >-
          pnpm turbo run build --output-logs=errors-only
          --filter=@openconditions/publishers...
          --filter=@openconditions/model-registry...
          --filter=@openconditions/federation...

      - name: TraFF feeds through libtraff
        run: bash scripts/traff-interop/check.sh

      - name: Registry TUF repositories through python-tuf
        run: bash scripts/tuf-interop/check.sh

  production-audit:
    needs: source
    name: production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/openlr-resolver/requirements-dev.txt

      - run: pnpm install --frozen-lockfile

      - name: Install Python audit tool
        working-directory: services/openlr-resolver
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Require clean production dependency audits
        run: pnpm audit:production

  build-images:
    needs: source
    if: github.event_name != 'schedule'
    name: image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: [ingest, contributions-api, federation, openlr-resolver]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # OCI import semantics match the qualified local Docker 29 toolchain.
      # This daemon belongs only to this disposable, read-only-token PR job.
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.9.2
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver: docker
      - name: Build, smoke, scan and bind image evidence
        env:
          IMAGE: ${{ matrix.image }}
        run: >-
          python scripts/qualify-container-images.py qualify
          --image "$IMAGE" --source "$GITHUB_SHA"
          --output "$RUNNER_TEMP/qualified-image"
      - name: Retain qualification or failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-image/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  images:
    name: container image qualification
    if: always() && github.event_name != 'schedule'
    needs: [source, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-evidence
      - name: Require every exact-source image and artifact
        env:
          IMAGE_BUILD_RESULT: ${{ needs.build-images.result }}
        run: >-
          python scripts/qualify-container-images.py collect
          --source "$GITHUB_SHA" --directory "$RUNNER_TEMP/image-evidence"

  required-ci:
    name: required CI
    if: always()
    needs: [source, ci, python-ci, interop, production-audit, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Require all applicable CI outcomes
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/check-ci-results.ts results

  full-main-qualification:
    name: full main qualification
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [source, ci, python-ci, interop, production-audit, images, required-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Record only complete executed main coverage
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/check-ci-results.ts full-main

  main-image-evidence:
    name: trusted main image evidence
    needs: full-main-qualification
    if: >-
      github.repository == 'OpenConditions/openconditions' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.full-main-qualification.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Independently bind trusted-main image evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/trusted-main-image-evidence.py assemble
          --output "$RUNNER_TEMP/trusted-main-image-evidence"
      - name: Retain trusted-main candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trusted-main-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted-main-image-evidence/
          if-no-files-found: error
          retention-days: 3
