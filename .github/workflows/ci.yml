name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name != 'schedule'
    name: typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version is read from package.json "packageManager" (single source of
      # truth). Passing `version:` here too errors: "Multiple versions of pnpm".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The OpenLR encoder's output is cross-checked against the Python
      # openlr library (packages/openlr/src/__tests__/python-openlr.test.ts).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: packages/openlr/python/requirements.txt

      - name: Install the OpenLR cross-check library
        run: pip install --require-hashes -r packages/openlr/python/requirements.txt

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Feeds lint
        run: pnpm feeds:lint

      - name: Feed schemas up to date
        run: pnpm check:feed-schemas

      - name: Credential guide up to date
        run: pnpm check-credentials

      - name: Model artifacts up to date
        run: pnpm check:model

      - name: Test
        run: pnpm test
        env:
          OPENLR_CROSSCHECK: required

  python-ci:
    if: github.event_name != 'schedule'
    name: python lint / test (openlr-resolver)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/openlr-resolver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            services/openlr-resolver/requirements.txt
            services/openlr-resolver/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest

  production-audit:
    name: production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/openlr-resolver/requirements-dev.txt

      - run: pnpm install --frozen-lockfile

      - name: Install Python audit tool
        working-directory: services/openlr-resolver
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Require clean production dependency audits
        run: pnpm audit:production
