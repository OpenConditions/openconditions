name: Product prepare and review
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare metadata for review, or review an already merged preparation
        required: true
        type: choice
        options: [prepare, review]
      version:
        description: Proposed product version (review uses the version committed in main)
        required: true
        type: string
      notes:
        description: Curated release notes for preparation; ignored during review
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: product-release
  cancel-in-progress: false
jobs:
  qualify:
    if: >-
      github.repository == 'OpenConditions/openconditions' &&
      github.repository_id == '1276024943' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'OpenConditions/openconditions/.github/workflows/product-release.yml@refs/heads/main' &&
      github.workflow_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Check current main evidence before installing tools
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python -B scripts/product-release-flow.py --check-only
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.9.2
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver: docker
      - name: Build pinned public OpenMapX contracts in an owned directory
        run: node scripts/acquire-product-tools.mjs "$RUNNER_TEMP/openmapx-tools"
      - name: Prepare or review exact owning-main evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: >-
          python -B scripts/product-release-flow.py
          --tools "$RUNNER_TEMP/openmapx-tools"
          --output "$RUNNER_TEMP/product-review"
      - name: Retain review artifact (never release approval)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/product-review
            ${{ runner.temp }}/product-review.receipt.json
          if-no-files-found: error
          retention-days: 3
