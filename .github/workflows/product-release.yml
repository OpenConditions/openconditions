name: Product qualification
on:
  workflow_dispatch:
    inputs:
      image_source:
        description: Exact qualified main image-source A commit
        required: true
        type: string
      manifest_source:
        description: Exact merged main manifest-source B commit
        required: true
        type: string
      image_run:
        description: Original A CI run ID
        required: true
        type: string
      image_attempt:
        description: Original A CI attempt
        required: true
        type: string
      manifest_run:
        description: Latest exact B main push CI run ID
        required: true
        type: string
      manifest_attempt:
        description: Latest exact B CI attempt
        required: true
        type: string
      version:
        description: Version already committed in B (not selected by this job)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: product-release
  cancel-in-progress: false
jobs:
  qualify:
    if: >-
      github.repository == 'OpenConditions/openconditions' &&
      github.repository_id == '1276024943' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'OpenConditions/openconditions/.github/workflows/product-release.yml@refs/heads/main' &&
      github.workflow_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.9.2
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver: docker
      - name: Qualify native image and merged manifest authorities
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_SOURCE: ${{ inputs.image_source }}
          MANIFEST_SOURCE: ${{ inputs.manifest_source }}
          IMAGE_RUN: ${{ inputs.image_run }}
          IMAGE_ATTEMPT: ${{ inputs.image_attempt }}
          MANIFEST_RUN: ${{ inputs.manifest_run }}
          MANIFEST_ATTEMPT: ${{ inputs.manifest_attempt }}
          VERSION: ${{ inputs.version }}
        run: >-
          python scripts/qualify-product-release.py
          --image-source "$IMAGE_SOURCE" --manifest-source "$MANIFEST_SOURCE"
          --image-run "$IMAGE_RUN" --image-attempt "$IMAGE_ATTEMPT"
          --manifest-run "$MANIFEST_RUN" --manifest-attempt "$MANIFEST_ATTEMPT"
          --version "$VERSION" --output "$RUNNER_TEMP/product-qualification.json"
      - name: Retain qualification only (not release approval)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/product-qualification.json
          if-no-files-found: error
          retention-days: 3
