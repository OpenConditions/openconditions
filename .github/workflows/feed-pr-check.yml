name: Feed PR check

on:
  pull_request:
    paths:
      - "feeds/**"
      - ".github/workflows/feed-pr-check.yml"
      - "scripts/check-changed-feeds.mjs"
      - "scripts/__tests__/check-changed-feeds.test.ts"

concurrency:
  group: feed-pr-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed-feeds:
    name: fetch + parse the feeds of changed region files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # exact event base/head objects and merge parents must be available
          persist-credentials: false

      # Version comes from package.json "packageManager" (single source of truth).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Select changed region files from the exact PR event
        id: selection
        run: node scripts/check-changed-feeds.mjs select

      - if: steps.selection.outputs.selected == 'true'
        run: pnpm install --frozen-lockfile

      # The checker loads every ingest domain, even for a single region file.
      - if: steps.selection.outputs.selected == 'true'
        run: pnpm build:domains

      # Gating: a feed whose payload does not parse fails the check; a network or
      # HTTP failure is only a warning annotation, and a feed whose credentials
      # this runner does not hold (every keyed feed) is skipped. Deleted files
      # have nothing to fetch. Git/event errors fail before selection is parsed;
      # the runner revalidates the immutable checkout before invoking the checker.
      - name: Check the feeds of changed region files
        if: steps.selection.outputs.selected == 'true'
        run: node scripts/check-changed-feeds.mjs run
