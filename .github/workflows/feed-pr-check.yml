name: Feed PR check

on:
  pull_request:
    paths:
      - "feeds/**"

concurrency:
  group: feed-pr-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed-feeds:
    name: fetch + parse the feeds of changed region files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # fetch-depth:0 checks out all branches, so origin/<base_ref> resolves.
      BASE_REF: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + all branches so the base-ref diff resolves

      # Version comes from package.json "packageManager" (single source of truth).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The check imports the built catalogue framework and domain packages.
      - run: pnpm --filter @openconditions/roads... build

      # Gating: a feed whose payload does not parse fails the check; a network or
      # HTTP failure is only a warning annotation, and a feed whose credentials
      # this runner does not hold (every keyed feed) is skipped. Deleted files
      # have nothing to fetch, so the diff keeps added and modified ones.
      - name: Check the feeds of changed region files
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT "${BASE_REF}...HEAD" -- 'feeds/*/*.jsonc')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No region file changed."
            exit 0
          fi
          pnpm exec tsx scripts/feeds-check.ts "${files[@]}"
