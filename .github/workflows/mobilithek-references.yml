name: Mobilithek reference files

on:
  schedule:
    - cron: "20 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check versioned site-table references
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Mobilithek reference files
        id: check
        run: pnpm check:mobilithek-references
      - name: Open an issue for stale or unavailable references
        if: steps.check.outputs.found == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: Mobilithek reference file needs review
          content-filepath: mobilithek-references/out.md
          labels: feed-issue
