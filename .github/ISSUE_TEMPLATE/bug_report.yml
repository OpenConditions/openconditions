name: Bug report
description: Report observed behavior that differs from what you expected.
type: Bug
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Report what you observed, even if it is intermittent or you cannot identify the cause. Link related reports when useful.

        Report vulnerabilities privately through [SECURITY.md](https://github.com/openconditions/openconditions/blob/main/SECURITY.md). Omit secrets and personal data from public reports.
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the result and who or what it affects.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: Reproduction attempts
      description: Tell us what you tried and how often it happens. Say if it is intermittent, not yet reproducible, or not safe to retry.
  - type: dropdown
    id: component
    attributes:
      label: Affected area
      options:
        - Not sure
        - Feed catalogue or parser
        - Ingest service
        - Contributions API
        - Federation
        - OpenLR resolver
        - Libraries or data model
        - Documentation or automation
  - type: input
    id: artifact
    attributes:
      label: Running artifact or source version
      description: Image repository and digest, package version, release asset or deployment identifier. For a source checkout, give its commit. Unknown is acceptable; your local git HEAD may differ from the installed artifact.
  - type: textarea
    id: context
    attributes:
      label: Environment and evidence
      description: Include relevant configuration, feed ID/domain, sanitized logs, timestamps or failing run URLs. Keep intentional log formatting and omit credentials, private endpoints and personal data.
