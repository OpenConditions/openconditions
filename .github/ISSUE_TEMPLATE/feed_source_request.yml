name: Feed request
description: Request a feed or propose a catalogue addition.
type: Feature
labels: [needs-triage, feed]
body:
  - type: markdown
    attributes:
      value: |
        OpenConditions uses a [multi-domain feed catalogue](https://github.com/openconditions/openconditions/tree/main/feeds). A supported format may need only a regional JSONC entry; other formats need parser work. You do not need to decide which before reporting a source.

        Unknown details are welcome for triage. Feed activation still requires confirmed reuse rights and access conditions. Never include key values, passwords, tokens or credential-bearing URLs.
  - type: input
    id: name
    attributes:
      label: Feed or publisher name
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - Not sure
        - Roads
        - Fuel
        - Parking
        - Charging
        - Cameras
        - Hazards
        - Weather
        - Vehicles
        - Border
  - type: input
    id: coverage
    attributes:
      label: Geographic coverage
      description: Country, region or area covered. Say unknown if necessary.
    validations:
      required: true
  - type: textarea
    id: endpoint
    attributes:
      label: Endpoint or source page
      description: Link the public endpoint, data portal or documentation. Say unknown if it is not yet available; omit credential values and private URLs.
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Data format
      options:
        - Unknown
        - DATEX II
        - Open511
        - WZDx
        - GeoJSON
        - JSON
        - XML
        - CSV
        - Other
  - type: textarea
    id: rights
    attributes:
      label: License, terms and attribution
      description: Link the license or terms and describe required attribution or reuse restrictions. Unknown is acceptable at intake.
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: Access requirements
      options:
        - Unknown
        - Public without registration
        - Registration or free key
        - Paid or metered access
        - Other restrictions
  - type: textarea
    id: context
    attributes:
      label: Access details and other context
      description: Link public access instructions or known rate limits, describe the intended use, and name related catalogue entries if known. Do not provide secret values.
