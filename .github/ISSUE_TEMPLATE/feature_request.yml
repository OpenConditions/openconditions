name: Feature request
description: Describe a need or a desired capability.
type: Feature
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Use the [Feed request form](https://github.com/openconditions/openconditions/issues/new?template=feed_source_request.yml) for a new feed. Open-ended design discussion and usage questions can go to [Discussions](https://github.com/openconditions/openconditions/discussions).
  - type: textarea
    id: need
    attributes:
      label: What do you need to do?
      description: Describe who needs this and the situation they face.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior you want. A proposed implementation is optional.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and attempts
      description: Add relevant examples, related work, alternatives you tried or constraints you know. Leave estimates and uncertain details for triage.
