version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      lint-and-format:
        patterns:
          - "@biomejs/*"
          - "prettier*"
      typescript-toolchain:
        patterns:
          - "typescript"
          - "@types/*"
          - "tsx"
          - "tsup"
      turbo:
        patterns:
          - "turbo"
      test-toolchain:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "testcontainers"
    ignore:
      # TypeScript 7 drops the compiler API that tsup's declaration build and
      # the import-boundary check use; move compiler majors as one migration.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
    ignore:
      # Pinned fork that provides the Node 24 runtime; the upstream 2.6.1 tag
      # regresses the runtime, so update this action by hand, not via Dependabot.
      - dependency-name: "OpenMapX/cla-assistant-action"

  - package-ecosystem: pip
    directory: "/services/openlr-resolver"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Group resolver dependencies into one PR.
      python-deps:
        patterns:
          - "*"

  # The Python openlr library the OpenLR encoder is cross-checked against in CI.
  - package-ecosystem: pip
    directory: "/packages/openlr/python"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    # Cover every Dockerfile so the digest-pinned base images get bumped (a
    # frozen digest only stays secure if something keeps it current).
    directories:
      - "/services/ingest"
      - "/services/openlr-resolver"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Stay on the pinned runtime lines (Node 24 LTS / Python 3.14 == CI); bump a
      # base-image major deliberately, not via Dependabot.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        # Python 3.14→3.15 is a "minor" bump in semver terms; ignore minor too so
        # the base stays on 3.14 (== the CI test runtime) until bumped on purpose.
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
